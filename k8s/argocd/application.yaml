apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: delivery-demo-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/golukumarkluniversity/DevOps-Project.git
    targetRevision: main
    path: k8s/environments/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: progressive-delivery
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
