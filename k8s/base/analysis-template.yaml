apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: delivery-demo-success-rate
spec:
  metrics:
    - name: success-rate
      interval: 30s
      count: 4
      failureLimit: 1
      inconclusiveLimit: 1
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{service="delivery-demo-canary",status=~"2.."}[2m]))
            /
            clamp_min(sum(rate(http_requests_total{service="delivery-demo-canary"}[2m])), 0.001)
      successCondition: result[0] >= 0.99
