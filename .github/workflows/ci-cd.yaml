name: CI and GitOps promotion

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  security-events: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  GITOPS_FILE: k8s/environments/dev/kustomization.yaml

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  build-and-scan:
    name: Build and scan image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ github.event_name == 'pull_request' }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  promote-dev:
    name: Promote immutable image to dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update GitOps image tag
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E "s#(newName: ).*#\\1${IMAGE_NAME}#" "${GITOPS_FILE}"
          sed -i -E "s/(newTag: ).*/\\1sha-${GITHUB_SHA}/" "${GITOPS_FILE}"
          sed -i -E "s/(app.kubernetes.io\\/version: ).*/\\1sha-${GITHUB_SHA}/" "${GITOPS_FILE}"
      - name: Commit GitOps change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${GITOPS_FILE}"
          git diff --cached --quiet || git commit -m "chore: promote ${GITHUB_SHA::7} to dev"
          git push
